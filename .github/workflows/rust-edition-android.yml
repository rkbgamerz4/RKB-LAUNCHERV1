
name: RKB Rust Edition Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-bundle-import
    paths:
      - 'rust/**'
      - 'app_pojavlauncher/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/rust-edition-android.yml'

permissions:
  contents: read

concurrency:
  group: rkb-rust-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rust + Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      NDK_VERSION: 27.2.12479018
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Android SDK Paths
        shell: bash
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Verify Rust Source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f rust/Cargo.toml ]; then
            echo "::error::Rust source is missing: rust/Cargo.toml"
            echo "Add the actual Rust project before running this workflow."
            exit 1
          fi

          echo "Rust project found."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target

      - name: Install Android SDK Command Line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          mkdir -p "$RUNNER_TEMP/android-cmdline"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$RUNNER_TEMP/android-cmdline"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -a "$RUNNER_TEMP/android-cmdline/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          # Ignore the expected yes-command Broken pipe,
          # but preserve sdkmanager's actual exit status.
          set +e
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          STATUS=$?
          set -e
          set -o pipefail

          exit "$STATUS"

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;$NDK_VERSION"

      - name: Configure Android NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ANDROID_HOME/platform-tools"

          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed

          echo "Android SDK setup successful."

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust ARM64
        working-directory: rust
        run: |
          cargo ndk -t arm64-v8a \
            -o ../app_pojavlauncher/src/main/jniLibs \
            build --release

      - name: Build Rust ARMv7
        working-directory: rust
        run: |
          cargo ndk -t armeabi-v7a \
            -o ../app_pojavlauncher/src/main/jniLibs \
            build --release

      - name: Verify Rust Libraries
        shell: bash
        run: |
          set -euo pipefail

          find app_pojavlauncher/src/main/jniLibs \
            -type f -name "*.so"

          test -n "$(find app_pojavlauncher/src/main/jniLibs \
            -type f -name '*.so' -print -quit)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app_pojavlauncher/build/outputs/apk/debug"

          find "$APK_PATH" -type f -name "*.apk"

          test -n "$(find "$APK_PATH" \
            -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-Rust-Edition-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Rust Libraries
        uses: actions/upload-artifact@v4
        with:
          name: RKB-Rust-Android-Libraries
          path: app_pojavlauncher/src/main/jniLibs/**/*.so
          if-no-files-found: error
          retention-days: 14
          

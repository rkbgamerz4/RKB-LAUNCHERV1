name: RKB Debug APK
on:
  workflow_dispatch:
  push:
    branches: [rkb-launcher]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk is 37.2 and NDK r25 is required by the build; sdkmanager fetches them.
      - name: Install SDK parts
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.2" "ndk;25.2.9519653" "cmake;3.22.1" || sdkmanager "platforms;android-37" "ndk;25.2.9519653"
      - name: Build debug APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rkb-launcher-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk

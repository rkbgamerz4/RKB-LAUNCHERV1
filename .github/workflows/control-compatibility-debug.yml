name: RKB Control Compatibility Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/control-compatibility
      - rkb-reference-ui

permissions:
  contents: read

concurrency:
  group: control-compatibility-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKB Launcher debug APK (arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "x86_64"

      - name: Checkout control compatibility branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found in Android SDK"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-37.2" "ndk;25.2.9519653" "cmake;3.22.1" || \
            "$SDKMGR" "platform-tools" "platforms;android-37" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run control compatibility unit tests
        shell: bash
        run: |
          ./gradlew :LayerController:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LayerController-unit-test-reports
          path: LayerController/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Build actual RKB Launcher debug APK
        shell: bash
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --no-daemon \
            --stacktrace

      - name: Verify debug APK
        shell: bash
        env:
          EXPECTED_PACKAGE: com.rkbgamerz.rkblauncher.debug
          EXPECTED_VERSION_CODE: ${{ github.run_number }}
          EXPECTED_LAUNCHABLE: com.movtery.zalithlauncher.ui.activities.SplashActivity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(ZalithLauncher/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No debug APK found in ZalithLauncher/build/outputs/apk/debug"
            exit 1
          fi
          printf 'Found %s debug APK(s):\n' "${#apks[@]}"
          ls -lh "${apks[@]}"
          sha256sum "${apks[@]}"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            badging="$("$AAPT2" dump badging "$apk")"
            package="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            version_code="$(printf '%s\n' "$badging" | sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p")"
            launchable="$(printf '%s\n' "$badging" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")"

            printf 'APK identity: package=%s versionCode=%s launchable=%s\n' \
              "$package" "$version_code" "$launchable"

            if [ "$package" != "$EXPECTED_PACKAGE" ]; then
              echo "::error::$apk has package '$package'; expected '$EXPECTED_PACKAGE' so it replaces the installed launcher"
              exit 1
            fi
            if [ "$version_code" != "$EXPECTED_VERSION_CODE" ]; then
              echo "::error::$apk has versionCode '$version_code'; expected '$EXPECTED_VERSION_CODE'"
              exit 1
            fi
            if [ "$launchable" != "$EXPECTED_LAUNCHABLE" ]; then
              echo "::error::$apk launches '$launchable'; expected '$EXPECTED_LAUNCHABLE'"
              exit 1
            fi

            dex_file="$(mktemp)"
            trap 'rm -f "$dex_file"' EXIT
            unzip -p "$apk" 'classes*.dex' > "$dex_file"
            for marker in RkbHomeScreen.kt RkbNavigationRail.kt RkbInstancesScreen.kt RkbSettingsHub.kt; do
              if ! grep -aqF "$marker" "$dex_file"; then
                echo "::error::$apk is missing reference UI marker '$marker'"
                exit 1
              fi
            done
            rm -f "$dex_file"
            trap - EXIT
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-Launcher-debug-arm64-control-compatibility
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

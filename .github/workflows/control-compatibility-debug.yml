name: RKB Control Compatibility Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/control-compatibility
      - feature/persistent-apk-signing

permissions:
  contents: read

concurrency:
  group: control-compatibility-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKB Launcher debug APK (arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "x86_64"

      - name: Checkout control compatibility branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found in Android SDK"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-37.2" "ndk;25.2.9519653" "cmake;3.22.1" || \
            "$SDKMGR" "platform-tools" "platforms;android-37" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up persistent signing
        uses: ./.github/actions/setup-rkb-signing
        env:
          RKB_KEYSTORE_BASE64: ${{ secrets.RKB_KEYSTORE_BASE64 }}
          RKB_STORE_PASSWORD: ${{ secrets.RKB_STORE_PASSWORD }}
          RKB_KEY_ALIAS: ${{ secrets.RKB_KEY_ALIAS }}
          RKB_KEY_PASSWORD: ${{ secrets.RKB_KEY_PASSWORD }}

      - name: Build actual RKB Launcher debug APK
        shell: bash
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --no-daemon \
            --stacktrace

      - name: Verify debug APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(ZalithLauncher/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No debug APK found in ZalithLauncher/build/outputs/apk/debug"
            exit 1
          fi
          printf 'Found %s debug APK(s):\n' "${#apks[@]}"
          ls -lh "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Verify APK package and signing identity
        uses: ./.github/actions/verify-rkb-apk
        with:
          apk-dir: ZalithLauncher/build/outputs/apk/debug
          expected-package: com.rkbgamerz.rkblauncher.debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-Launcher-debug-arm64-persistent-signing
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rkb-persistent-signing.jks"


name: RKB LAUNCHER Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-new-source

permissions:
  contents: read

concurrency:
  group: rkb-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RKB Launcher Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: rkb-new-source
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK directory not found"
            exit 1
          }

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in runner Android SDK"
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Check project structure
        shell: bash
        run: |
          chmod +x gradlew
          echo "Gradle root:"
          ls -la
          echo "Modules:"
          ./gradlew projects --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RKB-LAUNCHER-debug-apk
          path: |
            ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show failure hint
        if: failure()
        run: |
          echo "Build failed. Open the failed step and inspect its error."
          echo "Check SDK availability, Gradle modules, and compileSdk."

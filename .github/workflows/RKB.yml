
name: RKB LAUNCHER Build

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-new-source

permissions:
  contents: read

concurrency:
  group: rkb-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: rkb-new-source
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify project structure
        run: |
          echo "Current branch: $GITHUB_REF_NAME"
          java -version
          test -f gradlew
          test -f settings.gradle.kts
          test -f ZalithLauncher/build.gradle.kts
          chmod +x gradlew
          echo "Gradle modules:"
          ./gradlew projects --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RKB-LAUNCHER-debug-apk
          path: |
            ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build RKB Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up persistent signing
        uses: ./.github/actions/setup-rkb-signing
        env:
          RKB_KEYSTORE_BASE64: ${{ secrets.RKB_KEYSTORE_BASE64 }}
          RKB_STORE_PASSWORD: ${{ secrets.RKB_STORE_PASSWORD }}
          RKB_KEY_ALIAS: ${{ secrets.RKB_KEY_ALIAS }}
          RKB_KEY_PASSWORD: ${{ secrets.RKB_KEY_PASSWORD }}

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK package and signing identity
        uses: ./.github/actions/verify-rkb-apk
        with:
          apk-dir: ZalithLauncher/build/outputs/apk/release
          expected-package: com.rkbgamerz.rkblauncher

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-Launcher-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rkb-persistent-signing.jks"


name: Horizon Engine (arm64) - build from source
# Stage 1 of the Horizon integration: build the Android engine from the unofficial Android port's source
# (MIT) with the project's own build script, and extract everything the RKB integration needs to know.
# Nothing here touches the RKB app build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit of Rayan-XOO/horizon. Default = release 0.3.8 (tag android-v0.3.8, commit fc3e4d395016ae7210d1f54da5a09c0b2763b9ea)"
        required: true
        default: fc3e4d395016ae7210d1f54da5a09c0b2763b9ea
      profile:
        description: "release = slow build, fast game; debug = quick build, slow game"
        required: true
        default: release
        type: choice
        options: [release, debug]

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Checkout Horizon (unofficial Android port)
        uses: actions/checkout@v4
        with:
          repository: Rayan-XOO/horizon
          ref: ${{ inputs.ref }}
          path: horizon

      - name: Record exact source version
        run: |
          cd horizon
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H %cI %s'
          cat LICENSE | head -5

      # HorizonActivity.java needs a JDK 21 javac (JDK 25 output breaks d8 34, per ANDROID.md)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon

      - name: Android SDK / NDK (versions from ANDROID.md)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustc --version; cargo --version; java -version 2>&1 | head -1

      - name: Build engine + APK (project's own script)
        working-directory: horizon
        env:
          PROFILE: ${{ inputs.profile }}
        run: bash ./packaging/android/build_apk.sh

      - name: Inspect the result (what the RKB integration must reproduce)
        working-directory: horizon
        run: |
          set +e
          mkdir -p ../engine-out
          APK=target/android/horizon.apk
          cp "$APK" ../engine-out/horizon.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rm -rf /tmp/apk && mkdir /tmp/apk && unzip -q "$APK" -d /tmp/apk
          cp /tmp/apk/lib/arm64-v8a/*.so ../engine-out/ 2>/dev/null
          {
            echo "# Horizon engine build report"
            echo "- source: Rayan-XOO/horizon @ $SOURCE_SHA (ref: ${{ inputs.ref }}, profile: ${{ inputs.profile }})"
            echo "- rustc: $(rustc --version)"
            echo "- NDK: 27.2.12479018, API 26, arm64-v8a"
            echo; echo "## Files"; (cd ../engine-out && sha256sum * | sed 's/^/    /'; ls -l | sed 's/^/    /')
            echo; echo "## APK contents (top level + lib + assets)"; unzip -l "$APK" | sed 's/^/    /' | head -80
            echo; echo "## Manifest summary (aapt2 dump badging)"; "$BT/aapt2" dump badging "$APK" | sed 's/^/    /' | head -60
            echo; echo "## Activities / services / meta-data (xmltree)"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | sed 's/^/    /' | head -150
            for so in /tmp/apk/lib/arm64-v8a/*.so; do
              echo; echo "## $(basename "$so"): NEEDED libraries"; "$TC/llvm-readelf" -d "$so" | grep NEEDED | sed 's/^/    /'
              echo; echo "## $(basename "$so"): exported JNI / activity entry points"; "$TC/llvm-nm" -D --defined-only "$so" | grep -E "Java_|ANativeActivity|android_main" | sed 's/^/    /' | head -80
            done
            echo; echo "## Java classes in classes.dex"
            for d in /tmp/apk/classes*.dex; do "$BT/dexdump" -f "$d" | grep "Class descriptor" | sed 's/^/    /'; done
          } > ../engine-out/ENGINE_REPORT.md 2>&1
          cat ../engine-out/ENGINE_REPORT.md | head -200

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-engine-arm64-${{ inputs.profile }}
          path: engine-out/
          retention-days: 14

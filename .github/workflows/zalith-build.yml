name: RKB ZalithLauncher APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-fresh-import

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.2" "ndk;25.2.9519653" "cmake;3.22.1" || \
          sdkmanager "platform-tools" "platforms;android-37" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Check Gradle project
        run: |
          chmod +x gradlew
          ./gradlew projects --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RKB-ZalithLauncher-debug-APK
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

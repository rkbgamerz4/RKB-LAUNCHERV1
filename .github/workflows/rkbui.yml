
name: RKB LAUNCHER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-new-source
    paths:
      - '**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: rkb-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build ZalithLauncher Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: rkb-new-source
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Check project structure
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -f ZalithLauncher/build.gradle.kts
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-LAUNCHER-debug-apk
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

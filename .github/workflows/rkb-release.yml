name: RKB Release APK (fast, R8-optimized)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;25.2.9519653" "cmake;3.22.1" || true
          "$SDKM" "platforms;android-37.2" || "$SDKM" "platforms;android-37" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up persistent signing
        uses: ./.github/actions/setup-rkb-signing
        env:
          RKB_KEYSTORE_BASE64: ${{ secrets.RKB_KEYSTORE_BASE64 }}
          RKB_STORE_PASSWORD: ${{ secrets.RKB_STORE_PASSWORD }}
          RKB_KEY_ALIAS: ${{ secrets.RKB_KEY_ALIAS }}
          RKB_KEY_PASSWORD: ${{ secrets.RKB_KEY_PASSWORD }}
      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleRelease -Darch=arm64 --no-daemon --stacktrace
      - name: Verify APK package and signing identity
        uses: ./.github/actions/verify-rkb-apk
        with:
          apk-dir: ZalithLauncher/build/outputs/apk/release
          expected-package: com.rkbgamerz.rkblauncher
      - uses: actions/upload-artifact@v4
        with:
          name: rkb-launcher-release-arm64
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rkb-persistent-signing.jks"

name: Build RKB Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar || true

      - name: Download JRE 8
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav

      - name: Download JRE 17
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav

      - name: Download JRE 21
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build helper JARs
        run: |
          chmod +x gradlew scripts/*.sh 2>/dev/null || true
          ./gradlew :jre_lwjgl3glfw:build :arc_dns_injector:jar :forge_installer:jar --no-daemon || \
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate debug keystore
        run: |
          rm -f app_pojavlauncher/debug.keystore

          keytool -genkeypair \
            -v \
            -keystore app_pojavlauncher/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          mkdir -p out
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/RKBLauncher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKBLauncher-debug
          path: out/RKBLauncher-debug.apk
          if-no-files-found: error
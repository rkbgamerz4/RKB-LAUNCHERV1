name: RKB Launcher APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - rkb-complete-source-import-20261110-1607

permissions:
  contents: read

jobs:
  build:
    name: Build RKB Launcher
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout RKB source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.2" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle projects
        run: |
          chmod +x gradlew
          ./gradlew projects --no-daemon

      - name: Build RKB Launcher ARM64 APK
        run: |
          ./gradlew :ZalithLauncher:assembleDebug \
            -Darch=arm64 \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          find ZalithLauncher/build/outputs/apk/debug \
            -type f -name "*.apk" -print
          test -n "$(find ZalithLauncher/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

      - name: Upload RKB Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: RKB-LAUNCHER-ARM64-APK
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

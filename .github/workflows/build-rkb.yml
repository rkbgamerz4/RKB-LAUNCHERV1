name: Build RKB Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar || true

      - name: Download JRE 8
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav

      - name: Download JRE 17
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav

      - name: Download JRE 21
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav

      - name: Verify bundled Java runtimes
        # The three downloads above are allowed to fail so the job continues, but an APK built
        # without them cannot run Minecraft. Say so loudly instead of shipping a silent runtime-less APK.
        run: |
          missing=0
          for d in jre jre-new jre-21; do
            p=app_pojavlauncher/src/main/assets/components/$d
            if [ -f "$p/version" ] && [ -f "$p/universal.tar.xz" ]; then
              echo "OK      $d  (version $(cat $p/version))"
            else
              echo "::error::Java runtime '$d' is missing in the APK assets ($p). The upstream artifact download failed or expired."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning::Building anyway; the app will only run Java versions installed from a .tar.xz in Settings > Java."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build helper JARs
        run: |
          chmod +x gradlew scripts/*.sh 2>/dev/null || true
          ./gradlew :jre_lwjgl3glfw:build :arc_dns_injector:jar :forge_installer:jar --no-daemon || \
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove old debug keystore
        run: |
          rm -f app_pojavlauncher/debug.keystore
          rm -f app_pojavlauncher/debug.keystore.bak

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app_pojavlauncher/debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug keystore
        run: |
          echo "=== Keystore ==="
          file app_pojavlauncher/debug.keystore
          ls -lh app_pojavlauncher/debug.keystore

          echo "=== Key list ==="
          keytool -list \
            -keystore app_pojavlauncher/debug.keystore \
            -storetype JKS \
            -storepass android

          echo "=== Key verification ==="
          keytool -list \
            -keystore app_pojavlauncher/debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey

      - name: Clean Gradle build
        run: |
          ./gradlew :app_pojavlauncher:clean --no-daemon

      - name: Build Debug APK
        run: |
          mkdir -p out

          ./gradlew \
            :app_pojavlauncher:assembleDebug \
            --no-daemon \
            --no-build-cache

          cp app_pojavlauncher/build/outputs/apk/debug/*.apk \
            out/RKBLauncher-debug.apk

      - name: Verify APK
        run: |
          ls -lh out/RKBLauncher-debug.apk
          file out/RKBLauncher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKBLauncher-debug
          path: out/RKBLauncher-debug.apk
          if-no-files-found: error
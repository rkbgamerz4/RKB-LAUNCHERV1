plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

static def getDateSeconds() {
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        return 9934841 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
    } else {
        return 172005
    }
}

def getVersionName = {
    ByteArrayOutputStream TAG = new ByteArrayOutputStream()
    ByteArrayOutputStream BRANCH = new ByteArrayOutputStream()
    ByteArrayOutputStream TAG_PART_COMMIT = new ByteArrayOutputStream()
    String TAG_STRING

    exec {
        try {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue true
            standardOutput = TAG
        } catch (Exception e) {
            e.printStackTrace()
        }
    }

    if (TAG.toString() == "") {
        exec {
            try {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue true
                standardOutput = TAG_PART_COMMIT
            } catch (Exception e) {
            }
        }
    }

    if (TAG.toString() != "") {
        TAG_STRING = TAG.toString()
    } else {
        if (TAG_PART_COMMIT.toString().trim() == "") {
            return ("LOCAL-" + "${getDate()}")
        } else {
            TAG_STRING = 'gladiolus-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }
    }

    exec {
        try {
            commandLine 'git', 'branch', '--show-current'
            ignoreExitValue true
            standardOutput = BRANCH
        } catch (Exception e) {
            e.printStackTrace()
        }
    }

    return TAG_STRING.trim().replace("-g", "-") + "-" + BRANCH.toString().trim()
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY")
    if (key != null) return key

    File curseforgeKeyFile = new File("./curseforge_key.txt")
    if (curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text
    }

    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !')
    return "DUMMY"
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 34

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "androiddebugkey"
        }

        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.rkbgamerz.rkblauncher"

        minSdkVersion 21
        targetSdkVersion 34

        versionCode getDateSeconds()
        versionName getVersionName()

        multiDexEnabled true

        resValue 'string', 'curseforge_api_key', getCFApiKey()

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'

            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'

            signingConfig signingConfigs.customDebug

            resValue 'string', 'application_package',
                    'com.rkbgamerz.rkblauncher.debug'

            resValue 'string', 'storageProviderAuthorities',
                    'com.rkbgamerz.rkblauncher.scoped.gamefolder.debug'

            resValue 'string', 'shareProviderAuthority',
                    'com.rkbgamerz.rkblauncher.scoped.controlfolder.debug'
        }

        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }

        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            minifyEnabled false

            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'

            resValue 'string', 'storageProviderAuthorities',
                    'com.rkbgamerz.rkblauncher.scoped.gamefolder'

            resValue 'string', 'application_package',
                    'com.rkbgamerz.rkblauncher'
        }

        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
        }
    }

    ndkVersion = "25.2.9519653"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }

        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    buildToolsVersion = '34.0.0'
}

afterEvaluate {
    tasks.mergeDebugAssets.dependsOn(
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":jre_lwjgl3glfw:jar"
    )
}

dependencies {

    // =========================================================
    // Discord
    // =========================================================

    implementation files('libs/discord_partner_sdk.aar')


    // =========================================================
    // Android / UI
    // =========================================================

    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'


    // =========================================================
    // General dependencies
    // =========================================================

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'


    // =========================================================
    // Compression / parsing
    // =========================================================

    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'


    // =========================================================
    // Local JARs
    //
    // IMPORTANT:
    // Do NOT add commons-io here.
    // ExagearApacheCommons.jar already contains Commons IO.
    // Do NOT use fileTree() because it creates duplicate
    // dependencies from the entire libs directory.
    // =========================================================

    implementation files('libs/gson-2.8.6.jar')
    implementation files('libs/commons-compress-1.26.1.jar')
    implementation files('libs/exp4j-0.4.9-SNAPSHOT.jar')
    implementation files('libs/ExagearApacheCommons.jar')


    // =========================================================
    // Maven dependencies
    // =========================================================

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-compress:1.26.1'


    // =========================================================
    // NOTE
    //
    // commons-io:commons-io:2.15.1
    // intentionally removed.
    //
    // commons-io-2.15.1.jar
    // intentionally removed.
    //
    // fileTree(libs)
    // intentionally removed.
    //
    // ExagearApacheCommons.jar contains Apache Commons classes.
    // =========================================================
}